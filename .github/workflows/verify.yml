name: Verify Shell and PowerShell runners
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash and POSIX syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n install.sh
          sh -n linux/install.sh
          sh -n macos/install.sh
          for script in linux/*.sh macos/*.sh .test/*.sh; do
            bash -n "$script"
          done
      - name: Exercise Shell supervisor and real child restarts
        if: runner.os != 'Windows'
        shell: bash
        run: bash .test/shell.sh
      - name: Exercise WSL preflight and keepalive
        if: runner.os != 'Windows'
        shell: bash
        run: bash .test/wsl.sh
      - name: Exercise root installation in an isolated Linux container
        if: runner.os == 'Linux'
        shell: bash
        run: bash .test/root-install.sh
      - name: Exercise interrupted installs and uninstall recovery
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash .test/install-retry.sh
          bash .test/linux-compatibility.sh
          bash .test/docker.sh
          bash .test/systemd-control.sh
          bash .test/uninstall-recovery.sh
          bash .test/status.sh
          bash .test/sleep.sh
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem install.ps1,windows,linux,.test -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Exercise PowerShell supervisor and real child restarts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./.test/powershell.ps1
      - name: Exercise WSL Windows host task management
        if: runner.os == 'Windows'
        shell: powershell
        run: ./.test/wsl.ps1
      - name: Exercise Windows install retry and uninstall recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./.test/install-retry.ps1
          ./.test/uninstall-recovery.ps1
          ./.test/status.ps1
          ./.test/awake.ps1
